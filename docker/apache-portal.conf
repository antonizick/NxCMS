<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # No TLS terminates here and nothing sits in front locally, so the app's
    # own force-HTTPS redirect (public/.htaccess) would otherwise dead-end
    # every request. A real reverse proxy in front of this image would send
    # X-Forwarded-Proto: https instead, which the .htaccess rule already
    # honors, so this only ever matters for the bare local/test topology.
    # SetEnvIf, not SetEnv: plain SetEnv runs in Apache's "fixup" phase, which
    # is after .htaccess's per-directory RewriteCond already evaluated, so the
    # var would never be visible there. SetEnvIf runs early enough to be seen.
    SetEnvIf Request_URI ^ PORTAL_LOCAL_HTTP=1

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and suspenders alongside the .htaccess Deny rules: even if
    # AllowOverride were ever disabled, these stay blocked.
    <DirectoryMatch "^/var/www/html/(app|config|database|resources|storage|tools)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
